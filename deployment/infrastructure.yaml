AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Zongo application infrastructure including ECS EC2,
  ECR repositories, security groups, IAM roles, logging,
  and private S3 certificate storage.

Parameters:
  ECSInstanceType:
    Type: String
    Default: t3.small
  ECSAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

Resources:
  ############################################################
  # ECS Cluster
  ############################################################
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: zongo-prod

  ############################################################
  # Application Security Group
  ############################################################
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Zongo application security group
      VpcId:
        Fn::ImportValue: zongo-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: zongo-application-sg

  ############################################################
  # Certificate S3 Bucket
  #
  # CloudFormation generates the bucket name.
  #
  # Objects to upload:
  #
  #   prod/server.crt
  #   prod/server.key
  #
  ############################################################
  CertificateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ############################################################
  # Certificate Bucket Policy
  #
  # Explicitly deny unencrypted transport.
  ############################################################
  CertificateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CertificateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CertificateBucket.Arn
              - !Sub '${CertificateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ############################################################
  # ECS EC2 IAM Role
  ############################################################
  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ECSInstanceRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      ########################################################
      # Read-only access to certificate objects
      ########################################################
      Policies:
        - PolicyName: ReadZongoCertificates
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub '${CertificateBucket.Arn}/prod/server.crt'
                  - !Sub '${CertificateBucket.Arn}/prod/server.key'

  ############################################################
  # ECS Instance Profile
  ############################################################
  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ECSInstanceProfile'
      Roles:
        - !Ref ECSInstanceRole

  ############################################################
  # ECS EC2 Instance
  ############################################################
  ECSInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ECSAMI
      InstanceType: !Ref ECSInstanceType
      SubnetId:
        Fn::ImportValue: zongo-PublicSubnetId
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      IamInstanceProfile: !Ref ECSInstanceProfile
      Tags:
        - Key: Name
          Value: zongo-ecs-host
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -e

            #################################################
            # Cron job — runs regardless of what happens s3 #
            # Copy command for certificates                 #                       
            #################################################
            cat > /etc/cron.d/docker-prune <<'EOF'
            0 3 * * 0 root docker image prune -af --filter "until=168h" >> /var/log/docker-prune.log 2>&1
            EOF

            ####################################################
            # Certificate directory
            ####################################################
            mkdir -p /opt/zongo/certs
            chmod 755 /opt/zongo/certs

            ####################################################
            # Download TLS certificate and private key
            #
            # ECS agent is NOT started until these files
            # have been successfully downloaded.
            ####################################################
            aws s3 cp \
              s3://${CertificateBucket}/prod/server.crt \
              /opt/zongo/certs/server.crt

            aws s3 cp \
              s3://${CertificateBucket}/prod/server.key \
              /opt/zongo/certs/server.key

            ####################################################
            # Certificate permissions
            ####################################################
            chown root:root \
              /opt/zongo/certs/server.crt \
              /opt/zongo/certs/server.key

            chmod 644 \
              /opt/zongo/certs/server.crt

            chmod 600 \
              /opt/zongo/certs/server.key

            ####################################################
            # ECS configuration
            ####################################################
            cat > /etc/ecs/ecs.config <<'EOF'
            ECS_CLUSTER=zongo-prod
            ECS_ENABLE_CONTAINER_METADATA=true
            EOF

            ####################################################
            # Start ECS agent only after certificates exist
            ####################################################
            systemctl enable --now ecs

  ############################################################
  # Elastic IP for ECS EC2
  ############################################################
  ECSInstanceEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: zongo-ecs-eip

  ECSInstanceEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref ECSInstance
      AllocationId: !GetAtt ECSInstanceEIP.AllocationId

  ############################################################
  # ECR - Client
  ############################################################
  ClientRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: zongo-client
      ImageScanningConfiguration:
        ScanOnPush: true

  ############################################################
  # ECR - Server
  ############################################################
  ServerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: zongo-server
      ImageScanningConfiguration:
        ScanOnPush: true

  ############################################################
  # CloudWatch Logs
  ############################################################
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /zongo/application
      RetentionInDays: 30

  ############################################################
  # ECS Task Execution Role
  ############################################################
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ECSTaskExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDatabaseConnectionParameter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zongo/prod/database/connection'

  ############################################################
  # ECS Task Role
  #
  # Application does not directly call AWS APIs.
  ############################################################
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ECSTaskRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ECSExecAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

Outputs:
  ECSCluster:
    Description: ECS cluster
    Value: !Ref ECSCluster
    Export:
      Name: zongo-ECSCluster

  ApplicationSecurityGroup:
    Description: Application security group
    Value: !Ref ApplicationSecurityGroup
    Export:
      Name: zongo-ApplicationSecurityGroup

  ECSInstanceId:
    Description: ECS EC2 instance ID
    Value: !Ref ECSInstance

  ECSInstanceEIP:
    Description: Public EIP assigned to ECS EC2
    Value: !Ref ECSInstanceEIP

  ClientRepositoryUri:
    Description: Client ECR repository URI
    Value: !GetAtt ClientRepository.RepositoryUri
    Export:
      Name: zongo-ClientRepositoryUri

  ServerRepositoryUri:
    Description: Server ECR repository URI
    Value: !GetAtt ServerRepository.RepositoryUri
    Export:
      Name: zongo-ServerRepositoryUri

  ApplicationLogGroup:
    Description: CloudWatch application log group
    Value: !Ref ApplicationLogGroup
    Export:
      Name: zongo-ApplicationLogGroup

  ECSTaskExecutionRoleArn:
    Description: ECS task execution role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: zongo-ECSTaskExecutionRoleArn

  ECSTaskRoleArn:
    Description: ECS task role ARN
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: zongo-ECSTaskRoleArn

  CertificateBucketName:
    Description: S3 bucket containing Zongo TLS certificates
    Value: !Ref CertificateBucket
    Export:
      Name: zongo-CertificateBucketName