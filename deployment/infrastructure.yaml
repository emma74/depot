AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Zongo application infrastructure including ECS EC2,
  ECR repositories, security groups, IAM roles, logging,
  and private S3 certificate storage.

Parameters:
  ECSInstanceType:
    Type: String
    Default: t3.small

  ECSAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

Resources:

  ############################################################
  # ECS Cluster
  ############################################################
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: zongo-prod

  ############################################################
  # Application Security Group
  ############################################################
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Zongo application security group

      VpcId:
        Fn::ImportValue: zongo-VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: zongo-application-sg

  ############################################################
  # Certificate S3 Bucket
  #
  # CloudFormation generates the bucket name.
  #
  # Objects to upload:
  #
  #   prod/fullchain.pem
  #   prod/privkey.pem
  #
  ############################################################
  CertificateBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ############################################################
  # Certificate Bucket Policy
  #
  # Explicitly deny unencrypted transport.
  ############################################################
  CertificateBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref CertificateBucket

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'

            Resource:
              - !GetAtt CertificateBucket.Arn
              - !Sub '${CertificateBucket.Arn}/*'

            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ############################################################
  # ECS EC2 IAM Role
  #
  # TEMPORARY:
  # s3:PutObject is required to upload the TLS certificates
  # from the ECS EC2 instance.
  #
  # Remove s3:PutObject after the certificates are uploaded.
  ############################################################
  ECSInstanceRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${AWS::StackName}-ECSInstanceRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
        - PolicyName: ReadZongoCertificates

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject

                Resource:
                  - !Sub '${CertificateBucket.Arn}/prod/fullchain.pem'
                  - !Sub '${CertificateBucket.Arn}/prod/privkey.pem'

        - PolicyName: RenewZongoCertRestart
          # Lets renew-zongo-cert.sh find and stop the running zongo task after
          # uploading a renewed cert, so ECS reschedules a fresh nginx container
          # that picks up the new files from the /opt/zongo/certs host mount.

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow

                Action:
                  - ecs:ListTasks

                Resource:
                  - !GetAtt ECSCluster.Arn

              - Effect: Allow

                Action:
                  - ecs:StopTask

                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ECSCluster}/*'

  ############################################################
  # ECS Instance Profile
  ############################################################
  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ECSInstanceProfile'

      Roles:
        - !Ref ECSInstanceRole

  ############################################################
  # ECS EC2 Instance
  ############################################################
  ECSInstance:
    Type: AWS::EC2::Instance

    Properties:
      ImageId: !Ref ECSAMI
      InstanceType: !Ref ECSInstanceType

      SubnetId:
        Fn::ImportValue: zongo-PublicSubnetId

      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup

      IamInstanceProfile: !Ref ECSInstanceProfile

      Tags:
        - Key: Name
          Value: zongo-ecs-host

      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash

            ####################################################
            # Certificate directory
            ####################################################
            mkdir -p /opt/zongo/certs
            chmod 755 /opt/zongo/certs

            ####################################################
            # Download TLS certificate and private key
            # Correct filenames matching nginx.conf expectations
            ####################################################
            if aws s3 cp s3://${CertificateBucket}/prod/fullchain.pem /opt/zongo/certs/fullchain.pem && \
               aws s3 cp s3://${CertificateBucket}/prod/privkey.pem /opt/zongo/certs/privkey.pem; then
              chown root:root /opt/zongo/certs/fullchain.pem /opt/zongo/certs/privkey.pem
              chmod 644 /opt/zongo/certs/fullchain.pem
              chmod 600 /opt/zongo/certs/privkey.pem
              echo "$(date) Certificates downloaded successfully" >> /var/log/zongo-bootstrap.log
            else
              echo "$(date) WARNING: certificate download failed — provision manually" >> /var/log/zongo-bootstrap.log
            fi

            ####################################################
            # ECS configuration
            ####################################################
            cat > /etc/ecs/ecs.config <<'ECSEOF'
            ECS_CLUSTER=zongo-prod
            ECS_ENABLE_CONTAINER_METADATA=true
            ECSEOF

            ####################################################
            # Start ECS agent only if certs exist
            ####################################################
            if [ -f /opt/zongo/certs/fullchain.pem ] && [ -f /opt/zongo/certs/privkey.pem ]; then
              systemctl enable ecs
            else
              echo "$(date) ECS agent not started — certs missing" >> /var/log/zongo-bootstrap.log
            fi

            ####################################################
            # Install cron for systemd timers
            ####################################################

            cat > /usr/local/bin/renew-zongo-cert.sh <<'RENEWEOF'
            #!/bin/bash
            set -e

            certbot renew --quiet

            if [ -f /etc/letsencrypt/live/zongosupermarket.com/fullchain.pem ]; then
              aws s3 cp /etc/letsencrypt/live/zongosupermarket.com/fullchain.pem s3://${CertificateBucket}/prod/fullchain.pem
              aws s3 cp /etc/letsencrypt/live/zongosupermarket.com/privkey.pem s3://${CertificateBucket}/prod/privkey.pem

              cp /etc/letsencrypt/live/zongosupermarket.com/fullchain.pem /opt/zongo/certs/fullchain.pem
              cp /etc/letsencrypt/live/zongosupermarket.com/privkey.pem /opt/zongo/certs/privkey.pem

              chown root:root /opt/zongo/certs/fullchain.pem /opt/zongo/certs/privkey.pem
              chmod 644 /opt/zongo/certs/fullchain.pem
              chmod 600 /opt/zongo/certs/privkey.pem

              TASK_ARN=$(aws ecs list-tasks --cluster zongo-prod --service-name zongo --query "taskArns[0]" --output text)
              if [ "$TASK_ARN" != "None" ]; then
                aws ecs stop-task --cluster zongo-prod --task "$TASK_ARN" --reason "cert renewal"
              fi
            fi
            RENEWEOF

            chmod +x /usr/local/bin/renew-zongo-cert.sh

            cat > /etc/systemd/system/zongo-cert-renew.service <<'SVCEOF'
            [Unit]
            Description=Renew Zongo TLS certificate

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/renew-zongo-cert.sh
            SVCEOF

            cat > /etc/systemd/system/zongo-cert-renew.timer <<'TIMEREOF'
            [Unit]
            Description=Weekly Zongo cert renewal check

            [Timer]
            OnCalendar=Mon *-*-* 03:00:00
            Persistent=true

            [Install]
            WantedBy=timers.target
            TIMEREOF

            cat > /etc/systemd/system/zongo-docker-prune.service <<'PRUNEEOF'
            [Unit]
            Description=Prune unused Docker images

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/docker image prune -af --filter "until=168h"
            PRUNEEOF

            cat > /etc/systemd/system/zongo-docker-prune.timer <<'PRUNETIMEREOF'
            [Unit]
            Description=Weekly Docker image prune

            [Timer]
            OnCalendar=Sun *-*-* 03:00:00
            Persistent=true

            [Install]
            WantedBy=timers.target
            PRUNETIMEREOF

            systemctl daemon-reload
            systemctl enable --now zongo-cert-renew.timer
            systemctl enable --now zongo-docker-prune.timer

  ############################################################
  # Elastic IP for ECS EC2
  ############################################################
  ECSInstanceEIP:
    Type: AWS::EC2::EIP

    Properties:
      Domain: vpc

      Tags:
        - Key: Name
          Value: zongo-ecs-eip

  ECSInstanceEIPAssociation:
    Type: AWS::EC2::EIPAssociation

    Properties:
      InstanceId: !Ref ECSInstance

      AllocationId: !GetAtt ECSInstanceEIP.AllocationId

  ############################################################
  # ECR - Client
  ############################################################
  ClientRepository:
    Type: AWS::ECR::Repository

    Properties:
      RepositoryName: zongo-client

      ImageScanningConfiguration:
        ScanOnPush: true

  ############################################################
  # ECR - Server
  ############################################################
  ServerRepository:
    Type: AWS::ECR::Repository

    Properties:
      RepositoryName: zongo-server

      ImageScanningConfiguration:
        ScanOnPush: true

  ############################################################
  # CloudWatch Logs
  ############################################################
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: /zongo/application
      RetentionInDays: 30

  ############################################################
  # ECS Task Execution Role
  ############################################################
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${AWS::StackName}-ECSTaskExecutionRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

      Policies:
        - PolicyName: ReadDatabaseConnectionParameter

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zongo/prod/database/connection'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zongo/prod/jwt/secret'
          
          
  ############################################################
  # ECS Task Role
  #
  # Application does not directly call AWS APIs.
  ############################################################
  ECSTaskRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${AWS::StackName}-ECSTaskRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: ECSExecAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:
              - Effect: Allow

                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel

                Resource: '*'

Outputs:

  ECSCluster:
    Description: ECS cluster
    Value: !Ref ECSCluster

    Export:
      Name: zongo-ECSCluster

  ApplicationSecurityGroup:
    Description: Application security group
    Value: !Ref ApplicationSecurityGroup

    Export:
      Name: zongo-ApplicationSecurityGroup

  ECSInstanceId:
    Description: ECS EC2 instance ID
    Value: !Ref ECSInstance

  ECSInstanceEIP:
    Description: Public EIP assigned to ECS EC2
    Value: !Ref ECSInstanceEIP

  ClientRepositoryUri:
    Description: Client ECR repository URI
    Value: !GetAtt ClientRepository.RepositoryUri

    Export:
      Name: zongo-ClientRepositoryUri

  ServerRepositoryUri:
    Description: Server ECR repository URI
    Value: !GetAtt ServerRepository.RepositoryUri

    Export:
      Name: zongo-ServerRepositoryUri

  ApplicationLogGroup:
    Description: CloudWatch application log group
    Value: !Ref ApplicationLogGroup

    Export:
      Name: zongo-ApplicationLogGroup

  ECSTaskExecutionRoleArn:
    Description: ECS task execution role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn

    Export:
      Name: zongo-ECSTaskExecutionRoleArn

  ECSTaskRoleArn:
    Description: ECS task role ARN
    Value: !GetAtt ECSTaskRole.Arn

    Export:
      Name: zongo-ECSTaskRoleArn

  CertificateBucketName:
    Description: S3 bucket containing Zongo TLS certificates
    Value: !Ref CertificateBucket

    Export:
      Name: zongo-CertificateBucketName