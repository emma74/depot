AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Zongo CI/CD pipeline. Deploys the VPC and application infrastructure,
  builds Docker images into ECR, and deploys the ECS application.

Parameters:

  GitHubConnectionArn:
    Type: String
    Description: ARN of the AWS CodeStar Connections connection to GitHub.

  GitHubRepository:
    Type: String
    Description: GitHub repository in owner/repository format.

  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch used by the pipeline.

  InfrastructureStackName:
    Type: String
    Default: zongo-infrastructure
    Description: CloudFormation stack name for application infrastructure.

  ApplicationStackName:
    Type: String
    Default: zongo-application
    Description: CloudFormation stack name for ECS application resources.


Resources:

  ############################################################
  # Artifact bucket
  ############################################################

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  ############################################################
  # CodePipeline service role
  ############################################################

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-PipelineRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: PipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Artifact bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              # GitHub connection
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource:
                  - !Ref GitHubConnectionArn
              # CodeBuild
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:StopBuild
                Resource:
                  - !GetAtt CodeBuildProject.Arn

              # CloudFormation
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'

              # Allow CodePipeline to pass the CloudFormation service role
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt CloudFormationDeployRole.Arn


  ############################################################
  # CloudFormation deployment role
  ############################################################

  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-CloudFormationDeployRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: CloudFormationResourceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Broad permissions intentionally used for this
              # infrastructure deployment role.
              - Effect: Allow
                Action:
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - logs:*
                  - iam:*
                  - s3:*
                  - ssm:*
                  - secretsmanager:*
                  - elasticloadbalancing:*
                  - cloudwatch:*
                Resource: '*'


  ############################################################
  # CodeBuild role
  ############################################################

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-CodeBuildRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

              # CodePipeline artifact bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:PutObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'

              # ECR authentication
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'

              # Push images to Zongo ECR repositories
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/zongo-client'
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/zongo-server'

  ############################################################
  # EventBridge rule — triggers pipeline on GitHub push
  ############################################################

  PipelineTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-SourceTrigger'
      Description: Triggers the pipeline when the GitHub connection reports a repository change
      EventPattern:
        source:
          - aws.codestar-connections
          - aws.codeconnections
        detail-type:
          - CodeStar Connections Repository State Change
        resources:
          - !Ref GitHubConnectionArn
        detail:
          event:
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref GitHubBranch
      State: ENABLED
      Targets:
        - Id: PipelineTarget
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !GetAtt EventBridgeInvokeRole.Arn


  ############################################################
  # EventBridge invoke role
  ############################################################

  EventBridgeInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-EventBridgeInvokeRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: StartPipelineExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:StartPipelineExecution
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
  ############################################################
  # CodeBuild project
  ############################################################

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-DockerBuild'

      ServiceRole: !GetAtt CodeBuildRole.Arn

      Artifacts:
        Type: CODEPIPELINE

      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true

        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED


  ############################################################
  # CodePipeline
  ############################################################

  Pipeline:
    Type: AWS::CodePipeline::Pipeline

    Properties:
      Name: !Sub '${AWS::StackName}-Pipeline'

      RoleArn: !GetAtt PipelineRole.Arn

      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket

      RestartExecutionOnUpdate: true

      Stages:

        ########################################################
        # 1. SOURCE
        ########################################################

        - Name: Source
          Actions:

            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'

              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                DetectChanges: true

              OutputArtifacts:
                - Name: SourceOutput

              RunOrder: 1


        ########################################################
        # 2. APPLICATION INFRASTRUCTURE
        ########################################################

        - Name: Infrastructure
          Actions:

            - Name: DeployInfrastructure
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'

              InputArtifacts:
                - Name: SourceOutput

              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref InfrastructureStackName
                Capabilities: CAPABILITY_NAMED_IAM
                TemplatePath: SourceOutput::deployment/infrastructure.yaml
                RoleArn: !GetAtt CloudFormationDeployRole.Arn

              RunOrder: 1


        ########################################################
        # 3. BUILD DOCKER IMAGES
        ########################################################

        - Name: Build
          Actions:

            - Name: BuildImages
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'

              InputArtifacts:
                - Name: SourceOutput

              Configuration:
                ProjectName: !Ref CodeBuildProject

              # Makes CLIENT_IMAGE and SERVER_IMAGE available
              # to downstream pipeline actions.
              Namespace: BuildVariables

              RunOrder: 1


        ########################################################
        # 4. MANUAL APPROVAL
        ########################################################

        - Name: Approval
          Actions:

            - Name: ApproveProductionDeployment
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'

              RunOrder: 1


        ########################################################
        # 5. ECS DEPLOYMENT
        ########################################################

        - Name: Deploy
          Actions:

            - Name: DeployECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'

              InputArtifacts:
                - Name: SourceOutput

              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref ApplicationStackName
                Capabilities: CAPABILITY_NAMED_IAM

                TemplatePath: SourceOutput::deployment/ecs.yaml

                RoleArn: !GetAtt CloudFormationDeployRole.Arn

                ParameterOverrides: >-
                  {
                    "ClientImage": "#{BuildVariables.CLIENT_IMAGE}",
                    "ServerImage": "#{BuildVariables.SERVER_IMAGE}"
                  }

              RunOrder: 1


Outputs:

  PipelineName:
    Description: CodePipeline name
    Value: !Ref Pipeline

  ArtifactBucket:
    Description: Pipeline artifact bucket
    Value: !Ref ArtifactBucket

  CodeBuildProject:
    Description: CodeBuild project
    Value: !Ref CodeBuildProject

  CloudFormationDeployRole:
    Description: CloudFormation deployment role
    Value: !GetAtt CloudFormationDeployRole.Arn